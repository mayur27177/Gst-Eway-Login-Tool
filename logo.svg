(() => {
  'use strict';

  const WORKER_ORIGIN = 'https://cashfree-license-webhook.mayurgupta9829927177.workers.dev';
  const PRODUCTS = Object.freeze({
    'gst-eway-login-299': {
      name: 'GST & E-Way Login Tool', amount: 299, billing: 'One-time',
      note: 'One-time licence for one authorised installation.'
    },
    'gst-return-downloader-199': {
      name: 'GST Return Downloader', amount: 199, billing: 'One-time',
      note: 'One-time licence for the GST Return Downloader desktop application.'
    },
    'gstr-2b-reconciliation-499': {
      name: 'GSTR-2B Reconciliation', amount: 499, billing: 'Yearly',
      note: 'Yearly licence for the GSTR-2B reconciliation desktop application.'
    },
    'bank-sales-purchase-tally-1199': {
      name: 'Bank + Sales + Purchase to Tally', amount: 1199, billing: 'Yearly',
      note: 'Yearly licence for authorised Bank, Sales and Purchase to Tally workflows.'
    },
    'tally-custom-report-399': {
      name: 'Tally Custom Report', amount: 399, billing: 'Yearly',
      note: 'Yearly licence for the configured Tally custom report.'
    },
    'debtors-analysis-tool-499': {
      name: 'Debtors Analysis Tool', amount: 499, billing: 'Yearly',
      note: 'Yearly licence for the Debtors Analysis Tool.'
    }
  });

  const form = document.getElementById('checkout-form');
  if (!form) return;

  const params = new URLSearchParams(window.location.search);
  const productCode = String(params.get('product') || '').trim();
  const product = PRODUCTS[productCode];
  const nameInput = document.getElementById('customer-name');
  const mobileInput = document.getElementById('customer-mobile');
  const emailInput = document.getElementById('customer-email');
  const consentInput = document.getElementById('checkout-consent');
  const submitButton = document.getElementById('checkout-submit');
  const submitLabel = submitButton.querySelector('.submit-label');
  const spinner = submitButton.querySelector('.submit-spinner');
  const statusBox = document.getElementById('checkout-status');

  if (!product) {
    document.getElementById('checkout-product-name').textContent = 'Product not available';
    document.getElementById('checkout-price').textContent = '—';
    document.getElementById('checkout-billing').textContent = 'Unavailable';
    document.getElementById('checkout-product-note').textContent = 'Please return to the Products page and select Buy Now again.';
    setStatus('This product is not enabled for automated checkout.', 'error');
    submitButton.disabled = true;
    return;
  }

  document.title = `${product.name} Checkout | Samriddhi Associates`;
  document.getElementById('checkout-product-name').textContent = product.name;
  document.getElementById('checkout-price').textContent = formatRupees(product.amount);
  document.getElementById('checkout-billing').textContent = product.billing;
  document.getElementById('checkout-product-note').textContent = product.note;
  submitLabel.textContent = `Pay ${formatRupees(product.amount)}`;

  mobileInput.addEventListener('input', () => {
    mobileInput.value = mobileInput.value.replace(/\D/g, '').slice(0, 10);
    clearFieldError('customer-mobile');
  });
  [nameInput, emailInput].forEach((input) => input.addEventListener('input', () => clearFieldError(input.id)));
  consentInput.addEventListener('change', () => clearFieldError('checkout-consent'));

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearAllErrors();
    hideStatus();

    const customerName = nameInput.value.trim().replace(/\s+/g, ' ');
    const customerPhone = mobileInput.value.replace(/\D/g, '');
    const customerEmail = emailInput.value.trim().toLowerCase();

    let firstInvalid = null;
    if (customerName.length < 2) firstInvalid = setFieldError('customer-name', 'Enter a valid customer name.') || firstInvalid;
    if (!/^[6-9]\d{9}$/.test(customerPhone)) firstInvalid = setFieldError('customer-mobile', 'Enter a valid 10-digit Indian mobile number.') || firstInvalid;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(customerEmail)) firstInvalid = setFieldError('customer-email', 'Enter a valid email address.') || firstInvalid;
    if (!consentInput.checked) firstInvalid = setFieldError('checkout-consent', 'Please accept the terms before continuing.') || firstInvalid;

    if (firstInvalid) {
      firstInvalid.focus();
      return;
    }

    setBusy(true);
    setStatus('Creating your secure Cashfree order…', 'sending');

    try {
      const response = await fetch(`${WORKER_ORIGIN}/create-order`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          product_code: productCode,
          customer_name: customerName,
          customer_phone: customerPhone,
          customer_email: customerEmail
        })
      });

      const result = await response.json().catch(() => null);
      if (!response.ok || !result?.ok || !result?.payment_session_id) {
        throw new Error(result?.error || 'Unable to create the payment order. Please try again.');
      }

      sessionStorage.setItem('samriddhi_last_order_id', result.order_id || '');
      sessionStorage.setItem('samriddhi_last_product', product.name);
      setStatus('Opening Cashfree secure checkout…', 'success');

      if (typeof window.Cashfree !== 'function') {
        throw new Error('Cashfree checkout could not load. Please refresh the page and try again.');
      }

      const cashfree = window.Cashfree({ mode: 'production' });
      const checkoutResult = await cashfree.checkout({
        paymentSessionId: result.payment_session_id,
        redirectTarget: '_self'
      });

      if (checkoutResult?.error) {
        throw new Error(checkoutResult.error.message || 'Cashfree checkout could not be opened.');
      }
    } catch (error) {
      console.error('Checkout failed', error);
      setBusy(false);
      setStatus(error instanceof Error ? error.message : 'Checkout failed. Please try again.', 'error');
    }
  });

  function formatRupees(amount) {
    return `₹${Number(amount).toLocaleString('en-IN')}`;
  }

  function setBusy(busy) {
    submitButton.disabled = busy;
    spinner.hidden = !busy;
    submitLabel.textContent = busy ? 'Please wait…' : `Pay ${formatRupees(product.amount)}`;
  }

  function setStatus(message, type) {
    statusBox.hidden = false;
    statusBox.className = `checkout-status ${type || ''}`.trim();
    statusBox.textContent = message;
  }

  function hideStatus() {
    statusBox.hidden = true;
    statusBox.textContent = '';
    statusBox.className = 'checkout-status';
  }

  function setFieldError(id, message) {
    const input = document.getElementById(id);
    const error = document.querySelector(`[data-error-for="${id}"]`);
    if (input) input.setAttribute('aria-invalid', 'true');
    if (error) error.textContent = message;
    return input;
  }

  function clearFieldError(id) {
    const input = document.getElementById(id);
    const error = document.querySelector(`[data-error-for="${id}"]`);
    if (input) input.removeAttribute('aria-invalid');
    if (error) error.textContent = '';
  }

  function clearAllErrors() {
    ['customer-name', 'customer-mobile', 'customer-email', 'checkout-consent'].forEach(clearFieldError);
  }
})();
